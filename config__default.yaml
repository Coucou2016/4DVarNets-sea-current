# Default config - Fablet et al. JAMES 2024 + physics-augmented cost
data:
  source: synthetic
  cache: data/synthetic_osse.npz
  n_time: 40
  height: 48
  width: 48
  dT: 7
  # Paper/default NATL60 mode: require obs+oi; never fill y_ssh from SSH truth.
  allow_truth_background: false
  # Drop train windows whose SST history overlaps val targets (paper mode default = dT-1).
  # Set to 0 to disable; omit / null -> auto dT-1 when allow_truth_background is false.
  # purge_days: 6
  # NATL60 CPU smoke only (null = full paper grid / all windows):
  # crop_size: 48
  # max_samples: 4

model:
  dT_sst: 7
  n_iter: 5
  hidden_lstm: 64
  feat_dim: 12
  use_sst: true
  use_sqg: true
  use_adv: true
  use_uncert: true
  lam_obs: 1.0
  lam_sst: 1.0
  lam_prior: 0.1
  lam_sqg: 0.1
  lam_adv: 0.1
  Ld_km: 30
  kappa: 50.0
  dt_seconds: 86400
  uncert_sigma0: 0.05
  # alpha*strain ~ O(0.1-1) for ~0.3 m/s fields on dx~5.5 km; keep 1e4.
  uncert_alpha: 1.0e4
  # M4 fix: sigma from truth strain + MSE mix + sigma clamp + sigma-normalized NLL (see TrainingLoss).
  # Raw err^2/sigma^2 is ~1/sigma0^2 (~400x) MSE and SSH degrades (GPU96 M4 val~682, rmse_ssh~2x).
  # Normalized form: E[err^2 (sigma0/sigma)^2] + sigma0^2 E[log(sigma/sigma0)^2] ~ MSE when sigma~sigma0.
  uncert_from_truth: true
  uncert_max_mult: 10.0
  # Keep a strong MSE floor so NLL cannot abandon UV/SSH balance early.
  uncert_mse_mix: 0.5

physics:
  f0: 7.0e-5
  dx_deg: 0.05
  g: 9.81

train:
  epochs: 8
  batch_size: 4
  lr: 0.001
  seed: 0
  # auto -> CUDA when available, else CPU
  device: auto
  checkpoint_dir: checkpoints

loss:
  ssh: 50.0
  grad_ssh: 100.0
  uv: 50.0
  div: 100.0
  prior: 10.0
